# Replace the four entity IDs below if yours differ.
type: vertical-stack
cards:
  - type: entities
    title: ProSOFT-logge
    show_header_toggle: false
    entities:
      - entity: button.vaerksted_aqua_danmark_prosoft_10_hent_parameterlog
        name: Hent parameterlog
      - entity: button.vaerksted_aqua_danmark_prosoft_10_hent_haendelseslog
        name: Hent hændelseslog
  - type: markdown
    title: Parameterlog
    entity_id:
      - sensor.vaerksted_aqua_danmark_prosoft_10_parameterlog
    content: |-
      {% set entity = 'sensor.vaerksted_aqua_danmark_prosoft_10_parameterlog' %}
      {% set rows = state_attr(entity, 'entries') or [] %}
      {% set status = state_attr(entity, 'status') %}
      {% if status == 'fetching' %}
      Henter log …
      {% elif status == 'failed' %}
      Hentningen mislykkedes. Eventuelle tidligere poster vises nedenfor.
      {% endif %}
      {% if rows %}
      Senest hentet: {{ as_timestamp(states(entity)) | timestamp_custom('%d/%m/%Y %H:%M') }}
      {% if state_attr(entity, 'completion') == 'idle' %}
      Modtaget uden slutmarkør — fuldstændighed er ikke bekræftet.
      {% endif %}

      | Dato | Klokkeslæt | Indhold |
      | :--- | :--- | :--- |
      {% for row in rows -%}
      | {{ row.date or 'Ukendt' }} | {{ row.time or '—' }} | {{ row.content | e | replace('|', '&#124;') | replace('\n', ' ') | replace('\r', ' ') }} |
      {% endfor %}
      {% elif states(entity) not in ['unknown', 'unavailable'] %}
      Ingen logposter modtaget.
      {% else %}
      Tryk på henteknappen ovenfor for at hente loggen.
      {% endif %}
  - type: markdown
    title: Hændelseslog
    entity_id:
      - sensor.vaerksted_aqua_danmark_prosoft_10_haendelseslog
    content: |-
      {% set entity = 'sensor.vaerksted_aqua_danmark_prosoft_10_haendelseslog' %}
